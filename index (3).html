<style>
:root{
  --bg:#f5f0e6;--bg-deep:#e8dfcb;--ink:#1f2745;--ink-soft:#5a6180;
  --bead:#d8d0bb;--bead-edge:#b5ab90;--done:#b3552f;--done-edge:#8f421f;
  --line:#ddd4c0;--card:#fdfbf5;--card-edge:#ebe3d2;--accent:#b3552f;
  --bead-hi:#e9e2cd;--bead-lo:#c8bea2;--done-hi:#c96a42;--done-lo:#984324;
  --bg-hi:#faf6ec;
  --fs:20px;--radius:22px;
  --serif:Georgia,"Noto Serif","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --shadow-sm:0 1px 3px rgba(31,39,69,.06),0 1px 2px rgba(31,39,69,.04);
  --shadow-md:0 4px 16px rgba(31,39,69,.08);
  --shadow-lg:0 12px 40px rgba(31,39,69,.14);
}
[data-theme=azul]{
  --bg:#eef3f8;--bg-deep:#d6e2ef;--ink:#1f2d45;--ink-soft:#566478;
  --bead:#d2dfec;--bead-edge:#a9bacd;--done:#3f6a9c;--done-edge:#2c4d75;
  --line:#d0dce9;--card:#f8fbfe;--card-edge:#dde7f1;--accent:#3f6a9c;
  --bead-hi:#e4edf6;--bead-lo:#bfd0e0;--done-hi:#5a85b5;--done-lo:#2f5680;
  --bg-hi:#f4f8fc;
}
[data-theme=rosa]{
  --bg:#f9eef2;--bg-deep:#efd9e2;--ink:#3f2433;--ink-soft:#7a5768;
  --bead:#eccfd9;--bead-edge:#c9a5b5;--done:#b3557a;--done-edge:#8a3e5b;
  --line:#ebd4dd;--card:#fdf7fa;--card-edge:#f0dde5;--accent:#b3557a;
  --bead-hi:#f3dbe4;--bead-lo:#dfb9c7;--done-hi:#c56f91;--done-lo:#8f3c5e;
  --bg-hi:#fdf6f9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;overscroll-behavior:none}
body{display:flex;flex-direction:column;background:radial-gradient(ellipse 120% 80% at 50% 0%,var(--bg-hi) 0%,var(--bg) 45%,var(--bg-deep) 100%);transition:background .35s ease,color .35s ease}

/* ---------- HOME ---------- */
#home{position:fixed;inset:0;overflow:auto;z-index:5;padding:0 0 calc(20px + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse 120% 80% at 50% 0%,var(--bg-hi) 0%,var(--bg) 55%,var(--bg-deep) 100%);transition:background .35s ease;display:flex;flex-direction:column}
#home .hero{padding:calc(44px + env(safe-area-inset-top,0px)) 24px 20px;text-align:center}
#home .cross{width:44px;height:44px;margin:0 auto 14px;color:var(--accent);display:block}
#home h1{margin:0;font-family:var(--sans);font-weight:600;font-size:28px;letter-spacing:-.01em;color:var(--ink)}
#home p.sub{margin:6px 0 0;font-family:var(--sans);font-weight:400;font-size:15px;color:var(--ink-soft)}
#home .cards{display:flex;flex-direction:column;gap:12px;padding:8px 24px 0;max-width:420px;margin:0 auto;width:100%}
#home .current{text-align:center;margin-bottom:6px;font-family:var(--sans)}
#home .current .cl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
#home .current .cn{display:block;margin-top:4px;font-weight:600;font-size:17px;color:var(--ink)}
.home-btn{font:inherit;font-family:var(--sans);font-weight:600;font-size:18px;border-radius:16px;padding:17px;cursor:pointer;transition:all .15s;background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.home-btn:hover{border-color:var(--accent);color:var(--accent)}

function ensureAudio(){

function tone(freq,dur,type,gain,when){

let intro=4;
function buildSeq(){
  seq = S.app=="jose"?buildJose():S.app=="misericordia"?buildMisericordia():buildRosario();
  const total=seq.length;
  intro = S.app=="jose"?3:4;
  const ring=total-1-intro; /* contas do círculo; a última oração volta à conta grande do início */
  P = seq.map((s,i)=>{
    if(i<intro) return {x:0,y:INTRO_Y[i]};
    if(i==total-1) return null;
    const a=(90+(i-intro)*360/ring)*Math.PI/180;
    return {x:R*Math.cos(a),y:R*Math.sin(a)};
  });
  P[total-1]=P[intro];
}
function beadBig(s){ return ["pn","jpn","sr","jf","js","ms","msr","jg"].includes(s.t); }
function isCrossBead(s){ return s.t=="cr" || s.t=="js" || s.t=="ms"; }
function isAve(s){ return s.t=="am" || s.t=="jp"; }

function drawSvg(){
  let h=`<defs>
    <radialGradient id="gBead" cx="38%" cy="34%" r="72%"><stop offset="0%" stop-color="var(--bead-hi)"/><stop offset="100%" stop-color="var(--bead-lo)"/></radialGradient>
    <radialGradient id="gDone" cx="38%" cy="34%" r="72%"><stop offset="0%" stop-color="var(--done-hi)"/><stop offset="100%" stop-color="var(--done-lo)"/></radialGradient>
  </defs>`;
  h+=`<circle r="${R}" fill="none" stroke="var(--line)" stroke-width="4"/>`;
  h+=`<line x1="0" y1="${R}" x2="0" y2="${CROSS_Y}" stroke="var(--line)" stroke-width="4"/>`;
  P.forEach((p,i)=>{
    const s=seq[i];
    if(i==seq.length-1) return; /* a Salve Rainha usa a mesma conta grande do 1º Pai Nosso */
    if(isCrossBead(s)){
      const X=p.x,Y=p.y;
      const pt=a=>a.map(([x,y])=>(X+x)+" "+(Y+y)).join("L");
      const body=pt([[-13,-62],[13,-62],[13,-38],[40,-38],[40,-12],[13,-12],[13,62],[-13,62],[-13,-12],[-40,-12],[-40,-38],[-13,-38]]);
      const halo=pt([[-22,-71],[22,-71],[22,-47],[49,-47],[49,-3],[22,-3],[22,71],[-22,71],[-22,-3],[-49,-3],[-49,-47],[-22,-47]]);
      h+=`<g class="b" data-i="${i}" tabindex="0" role="button" aria-label="Cruz"><rect x="${X-52}" y="${Y-76}" width="104" height="152" fill="transparent"/><path class="v" stroke-linejoin="round" d="M${body}Z"/><path class="r" stroke-linejoin="round" d="M${halo}Z"/></g>`;
      return;
    }
    const big=beadBig(s),r=big?40:30;
    h+=`<g class="b ${big?"pn":""}" data-i="${i}" tabindex="0" role="button" aria-label="Conta ${i+1}"><circle cx="${p.x}" cy="${p.y}" r="${r+14}" fill="transparent"/><circle class="v" cx="${p.x}" cy="${p.y}" r="${r}"/><circle class="r" cx="${p.x}" cy="${p.y}" r="${r+9}"/>`;
    if(isAve(s)) h+=`<text x="${p.x}" y="${p.y}">${s.n}</text>`;
    h+="</g>";
  });
  svg.innerHTML=h;
  gs=[...svg.querySelectorAll(".b")];
}
function vb(){
  const w=svg.clientWidth||400,hh=svg.clientHeight||500;
  const W=Math.max(300,Math.min(460,w)),H=W*hh/w;
  svg.setAttribute("viewBox",`${cx-W/2} ${cy-H/2} ${W} ${H}`);
}
function go(x,y){
  cancelAnimationFrame(raf);
  const x0=cx,y0=cy,t0=performance.now();
  (function f(t){
    const k=Math.min(1,(t-t0)/450),e=1-Math.pow(1-k,3);
    cx=x0+(x-x0)*e;cy=y0+(y-y0)*e;vb();
    if(k<1)raf=requestAnimationFrame(f);
  })(t0);
}

/* ============ INFO ============ */
function info(){
  const p=S.pos[S.app];
  if(p>=seq.length)return["Terço concluído","Deus abençoe sua oração. 🙏"];
  const s=seq[p];let ti,tx;
  if(S.app=="rosario"){
    const mn=s.d?M[mys()][s.d-1]:"";
    if(s.t=="cr"){ti="Sinal da Cruz, Credo e Pai Nosso";tx=T.sc+"\n\n"+T.cr+"\n\n"+T.pn;if(S.it)tx="Intenção: "+S.it+"\n\n"+tx}
    else if(s.t=="sr"){ti="Glória, Ó meu Jesus e Salve Rainha";tx=T.gl+"\n\n"+T.je+"\n\n"+T.sr+"\n\n"+T.fim}
    else if(s.t=="pn"){ti=s.d?"Glória e Pai Nosso":"Pai Nosso";tx=(s.d?T.gl+"\n\n"+(s.d>1?T.je+"\n\n":"")+"Medite: "+s.d+"º mistério, "+mn+".\n\n":"")+T.pn}
    else{ti="Ave Maria"+(s.d?" · "+s.n+" de 10":" · "+["pela fé","pela esperança","pela caridade"][s.n-1]);tx=T.am}
  } else if(S.app=="jose"){
    if(s.t=="js"){ti="Sinal da Cruz e Pai Nosso";tx=JOSE_T.sinal+"\n\n"+JOSE_T.pn;if(S.it)tx="Intenção: "+S.it+"\n\n"+tx}
    else if(s.t=="jam"){ti="Ave Maria";tx=JOSE_T.am}
    else if(s.t=="jgl"){ti="Glória";tx=JOSE_T.gl}
    else if(s.t=="jg"){ti=s.d+"ª dezena · Conta grande";tx=JOSE_T.grande}
    else if(s.t=="jp"){ti=s.d+"ª dezena · "+s.n+" de 10";tx=JOSE_T.pequena}
    else if(s.t=="jf"){ti="Oferecimento a São José";tx=JOSE_T.oferecimento}
  } else {
    if(s.t=="ms"){ti="Sinal da Cruz, Credo e Pai Nosso";tx=T.sc+"\n\n"+T.cr+"\n\n"+T.pn;if(S.it)tx="Intenção: "+S.it+"\n\n"+tx}
    else if(s.t=="msr"){ti="Salve Rainha";tx=DM_T.sr}
    else if(s.t=="pn"){ti=s.d?"Eterno Pai · "+s.d+"ª dezena":"Pai Nosso";tx=(s.d?"Medite a "+s.d+"ª dezena da Paixão.\n\n":"")+DM_T.pnGrande}
    else if(s.mi3){ti="Deus Santo · "+s.n+" de 3";tx=DM_T.final3x}
    else{ti="Pela Sua dolorosa Paixão"+(s.d?" · "+s.n+" de 10":"");tx=DM_T.amPequena}
  }
  return[ti,tx];
}
function countDone(){
  const p=S.pos[S.app];
  if(S.app=="jose") return seq.filter((s,i)=>i<p && s.t=="jp").length;
  return seq.filter((s,i)=>i<p && s.t=="am" && s.d).length;
}

/* ============ RENDER ============ */
function draw(jump){
  const p=S.pos[S.app];
  const last=seq.length-1;
  gs.forEach((g,i)=>{
    const k=(i==intro&&p>=last)?last:i; /* ao final, a conta do 1º Pai Nosso passa a ser a Salve Rainha */
    g.dataset.i=k;
    g.classList.toggle("d",k<p);g.classList.toggle("c",k==p);
  });
  $("cnt").textContent=countDone()+"/50";
  $("pbar").style.width=Math.min(100,(p/seq.length)*100)+"%";
  let lb;
  if(p>=seq.length)lb="Concluído";
  else if(S.app=="rosario"){
    const dec=p>=seq.length-1||p<4?0:Math.floor((p-4)/11)+1;
    lb=p==seq.length-1?"Salve Rainha":dec?dec+"º mistério · "+M[mys()][dec-1]:"Orações iniciais";
  } else if(S.app=="jose"){
    const s=seq[p];
    if(s.t=="jf")lb="Oferecimento final";
    else if(s.d)lb=s.d+"ª dezena · São José";
    else lb="Orações iniciais";
  } else {
    const dec=p<4?0:Math.min(5,Math.floor((p-4)/11)+1);
    lb=p>=seq.length-1?"Salve Rainha":dec?dec+"ª dezena · Divina Misericórdia":"Orações iniciais";
  }
  $("lb").textContent=lb;
  const[ti,tx]=info();$("ti").textContent=ti;$("tx").textContent=tx;$("tx").scrollTop=0;
  document.documentElement.style.setProperty("--fs",S.fs+"px");
  save();
  const t=P[Math.min(p,P.length-1)];
  if(jump){cx=t.x;cy=t.y;vb()}else go(t.x,t.y);
}

function setPos(p){
  const prev=S.pos[S.app],len=seq.length;
  if(p==len&&prev<len){
    const label=S.app=="rosario"?mys():S.app=="jose"?"São José":"Misericórdia";
    S.hist[S.app].unshift({d:new Date().toLocaleDateString("pt-BR"),m:label});
    S.hist[S.app]=S.hist[S.app].slice(0,50);
    playSfx("finish");
  } else if(p>prev&&p<len){
    const s=seq[p-1];
    if(S.app=="jose"){
      if(s&&s.t=="jp"&&s.n==10) playSfx("decade"); else playSfx("tap");
    } else {
      if(s&&s.t=="am"&&s.n==10&&s.d) playSfx("decade"); else playSfx("tap");
    }
  }
  const np=Math.max(0,Math.min(len,p));
  if(S.app=="rosario"){
    if(S.pos.rosario==0&&np>0&&!M[S.m]&&!S.lock)S.lock=mys();
    if(np==0)S.lock=null;
  }
  S.pos[S.app]=np;
  try{S.vib&&navigator.vibrate&&navigator.vibrate(15)}catch(e){}
  draw(false);
}

/* ============ DIALOG ============ */
function showDialog(html){
  const d=$("md");
  d.innerHTML=`<div class="dialog">${html}</div>`;
  d.hidden=false;
  return d.querySelector(".dialog");
}
function closeDialog(){ $("md").hidden=true; $("md").innerHTML=""; }

function askIntent(app,onStart){
  const dlg=showDialog(`
    <h3>Qual é a sua intenção?</h3>
    <p>Antes de começar, você pode oferecer este terço por uma intenção especial. É opcional.</p>
    <textarea id="intentInput" placeholder="Por quem ou pelo que você quer rezar?">${(S.it||"").replace(/</g,"&lt;")}</textarea>
    <div class="row">
      <button id="skipBtn">Pular</button>
      <button id="okBtn" class="btn-primary">Começar</button>
    </div>
  `);
  const ta=dlg.querySelector("#intentInput");
  setTimeout(()=>ta.focus(),50);
  dlg.querySelector("#okBtn").onclick=()=>{
    S.it=ta.value.trim();
    save();
    closeDialog();
    onStart();
  };
  dlg.querySelector("#skipBtn").onclick=()=>{
    closeDialog();
    onStart();
  };
}
function ask(msg,ok){
  const dlg=showDialog(`<p style="margin:0 0 20px;font-family:var(--sans);font-size:16px;line-height:1.5;color:var(--ink)">${msg}</p>
    <div class="row"><button id="mno">Cancelar</button><button id="my">Confirmar</button></div>`);
  dlg.querySelector("#my").onclick=()=>{closeDialog();ok()};
  dlg.querySelector("#mno").onclick=closeDialog;
}

/* ============ NAVEGAÇÃO ============ */
function getLen(app){
  if(app=="jose") return buildJose().length;
  if(app=="misericordia") return buildMisericordia().length;
  return buildRosario().length;
}
function openApp(app){
  S.app=app;
  $("home").hidden=true;
  $("player").hidden=false;
  $("appName").textContent= app=="rosario"?"Santo Terço":app=="jose"?"São José":"Divina Misericórdia";
  buildSeq();drawSvg();
  const p=Math.min(S.pos[app],P.length-1);
  cx=P[p].x;cy=P[p].y;vb();
  draw(true);
}
function startRosary(app){
  askIntent(app, ()=>{
    if(S.pos[app]>=getLen(app)) S.pos[app]=0;
    openApp(app);
  });
}
const APPS={rosario:"Santo Terço",jose:"Terço de São José",misericordia:"Divina Misericórdia"};
function goHome(){
  if(!APPS[S.app])S.app="rosario";
  $("curName").textContent=APPS[S.app];
  $("home").hidden=false;
  $("player").hidden=true;
  save();
}
$("bk").onclick=goHome;
$("hPlay").onclick=()=>startRosary(S.app);
$("hOpts").onclick=()=>openMenu();

/* ============ EVENTOS SVG ============ */
svg.addEventListener("click",e=>{
  const g=e.target.closest(".b");if(!g)return;
  const i=+g.dataset.i,p=S.pos[S.app];
  if(i==p)setPos(i+1);
  else if(i==p-1)setPos(i);
  else if(i>p)ask(`Marcar ${i+1-p} contas de uma vez?`,()=>setPos(i+1));
  else ask(`Desmarcar ${p-i} contas?`,()=>setPos(i));
});
svg.addEventListener("keydown",e=>{
  if(e.key=="Enter"||e.key==" "){
    const g=e.target.closest(".b");
    if(g){e.preventDefault();g.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
  }
});
$("pr").onclick=()=>{
  const c=$("sh").classList.toggle("cl");
  $("pr").setAttribute("aria-pressed",!c);
};
